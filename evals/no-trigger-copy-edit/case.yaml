schema_version: "1.1"
name: no-trigger-copy-edit
description: Over-triggering guard — a trivial copy edit on a front-end file must not load any audit skill.
tags: [trigger, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    In index.html, change the footer copyright year from 2026 to 2027. Nothing else.
  max_turns: 8
  timeout_seconds: 300
  allowed_tools: [Read, Edit, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: no-audit-skill-loaded
    tool: Skill
    input_match: 'perf-audit|a11y-audit|css-audit|layout-audit'
    min: 0
    max: 0
  - type: regex
    name: year-updated
    target: { source: file, path: index.html }
    pattern: '© 2027 Lumen Analytics'
  - type: regex
    name: preserve-rest-of-page
    target: { source: file, path: index.html }
    pattern: 'Analytics your whole team[\s\S]*class="cookie-banner"'
