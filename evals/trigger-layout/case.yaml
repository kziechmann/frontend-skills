schema_version: "1.1"
name: trigger-layout
description: Skill selection — a natural request that should load the layout-audit skill without naming it.
tags: [trigger, layout]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    People keep telling us our pricing page (index.html in this folder) looks broken on their phones. Can you take a look?
  max_turns: 6
  timeout_seconds: 400
  allowed_tools: [Bash, Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    name: loads-layout-audit
    tool: Skill
    input_match: 'layout-audit'
