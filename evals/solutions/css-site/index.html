<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Team dashboard</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="site-header">
    <div class="brand">Pulse</div>
    <ul class="main-nav">
      <li><a href="#" class="active" aria-current="page">Overview</a></li>
      <li><a href="#">Reports</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </div>

  <div class="layout">
    <div class="sidebar">
      <h3>Teams</h3>
      <a href="#">Design</a>
      <a href="#">Platform</a>
      <a href="#">Growth</a>
    </div>

    <div class="content">
      <h1 class="page-title">Overview</h1>
      <div class="cards">
        <div class="card">
          <div class="card-title">Active users</div>
          <div class="card-value">12,480</div>
          <div class="card-delta up">▲ 8.2%</div>
        </div>
        <div class="card">
          <div class="card-title">Conversion</div>
          <div class="card-value">3.4%</div>
          <div class="card-delta down">▼ 0.6%</div>
        </div>
        <div class="card">
          <div class="card-title">Avg. session</div>
          <div class="card-value">6m 12s</div>
          <div class="card-delta up">▲ 1.1%</div>
        </div>
      </div>
      <div class="panel">
        <h2>Weekly report</h2>
        <p>Signups grew for the third week in a row, driven by the new onboarding checklist.</p>
        <button class="btn btn-primary">Download CSV</button>
        <button class="btn">Share</button>
      </div>
    </div>
  </div>
</body>
</html>
