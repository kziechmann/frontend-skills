name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: Run the Claude eval suite (uses ANTHROPIC_API_KEY, costs money)
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y bubblewrap socat
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The harness write-denies /tmp inside its sandbox; keep run workspaces elsewhere.
          TMPDIR: ${{ runner.temp }}/claude-eval
        run: >
          mkdir -p "$TMPDIR" &&
          claude plugin eval . --scaffold --allow-tools Bash Write Edit --trust-plugin
          --runs 1 --no-publish --max-cost-usd 25 --threshold 0
          --json evals/results/ci.json --report evals/results/report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
